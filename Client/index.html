  <script>
    function getLocation() {
      const output = document.getElementById('locationDisplay');

      if (!navigator.geolocation) {
        output.innerHTML = "Geolocation is not supported by your browser.";
        return;
      }

      output.innerHTML = "Locating…";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          output.innerHTML = `
            <strong>Latitude:</strong> ${lat} <br/>
            <strong>Longitude:</strong> ${lon} <br/>
            <strong>Accuracy:</strong> ±${accuracy} meters
          `;

          // Optional: Reverse geocode using a third-party API like OpenCage or Google Maps API
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              output.innerHTML = "User denied the request for Geolocation.";
              break;
            case error.POSITION_UNAVAILABLE:
              output.innerHTML = "Location information is unavailable.";
              break;
            case error.TIMEOUT:
              output.innerHTML = "The request to get user location timed out.";
              break;
            default:
              output.innerHTML = "An unknown error occurred.";
              break;
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,      // Wait up to 10 seconds
          maximumAge: 0        // Do not use cached position
        }
      );
    }
  </script>
